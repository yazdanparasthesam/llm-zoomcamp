# Render.com Blueprint — connect the GitHub repo; Render builds this Dockerfile
services:
  - type: web
    name: tripilot-app
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false        # set in the Render dashboard (optional; offline mock without it)
