[project]
name = "tripilot"
version = "1.0.0"
description = "TripPilot — agentic trip & relocation copilot (RAG + tools + multimodal), LLM Zoomcamp Capstone 3"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit==1.36.0",
    "scikit-learn==1.5.0",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "requests==2.32.3",
    "psycopg2-binary==2.9.9",
    "openai==1.35.1",
    "pydantic==2.13.4",
    "pytest==8.2.2",
    "dlt==1.3.0",
    "duckdb==1.1.3",
    "python-dotenv==1.0.1",
    "elasticsearch==8.15.1",
    "gtts==2.5.1",
    "setuptools==80.9.0",  # last release shipping pkg_resources, required by dlt 1.3.0 at import time (removed in setuptools 81)
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
