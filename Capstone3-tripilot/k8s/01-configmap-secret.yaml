apiVersion: v1
kind: ConfigMap
metadata:
  name: tripilot-config
data:
  POSTGRES_HOST: tripilot-postgres
  POSTGRES_DB: tripilot_db
  POSTGRES_USER: postgres
  ELASTICSEARCH_HOST: tripilot-elasticsearch
  LLM_PROVIDER: groq
---
apiVersion: v1
kind: Secret
metadata:
  name: tripilot-secret
type: Opaque
stringData:
  POSTGRES_PASSWORD: postgres
  # replace with your key for live LLM mode; app works in offline mock otherwise
  GROQ_API_KEY: ""
