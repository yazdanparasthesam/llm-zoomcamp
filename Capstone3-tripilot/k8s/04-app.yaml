apiVersion: apps/v1
kind: Deployment
metadata:
  name: tripilot-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tripilot-app
  template:
    metadata:
      labels:
        app: tripilot-app
    spec:
      containers:
        - name: app
          image: tripilot-app:latest
          imagePullPolicy: IfNotPresent   # `kind load docker-image` friendly
          ports:
            - containerPort: 8501
          envFrom:
            - configMapRef:
                name: tripilot-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tripilot-secret
                  key: POSTGRES_PASSWORD
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tripilot-secret
                  key: GROQ_API_KEY
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8501
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: tripilot-app
spec:
  selector:
    app: tripilot-app
  ports:
    - port: 8501
      targetPort: 8501
