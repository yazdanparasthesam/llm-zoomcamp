name: TripPilot CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify snapshot & ground truth are reproducible (seeds 42/123)
        run: |
          sha256sum data/reviews_snapshot.json > /tmp/before.sha
          python3 data/generate_snapshot.py
          python3 data/generate_ground_truth.py
          sha256sum -c /tmp/before.sha

      - name: dlt ingestion -> normalized extract
        run: python3 ingestion/hotel_reviews_pipeline.py

      - name: Module-07 chunking + embeddings
        run: python3 -m src.ingest

      - name: Retrieval evaluation (4 approaches + winner selection)
        run: python3 -m src.eval_retrieval

      - name: PyTest suite (offline; mock LLM mode)
        run: python3 -m pytest tests/ -q

      - name: Docker image builds
        run: docker build -t tripilot-app:ci .
