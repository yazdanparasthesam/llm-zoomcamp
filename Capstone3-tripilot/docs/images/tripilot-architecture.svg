<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1420" viewBox="0 0 1120 1420" role="img" aria-labelledby="title description">
<title id="title">TripPilot system architecture and data flow</title>
<desc id="description">Three separated layers: prepare hotel-review data with dlt, DuckDB, chunking and a local search index; process Streamlit requests using planning tools, retrieval, answer generation and judging; store conversations and user feedback for monitoring. Elasticsearch is an optional mirror, not the application retrieval index. Streamlit Monitoring reads PostgreSQL or SQLite. Grafana reads PostgreSQL only. External model and flight APIs are optional; the recorded default path uses mock answers and heuristic judgments.</desc>
<defs>
  <marker id="arrow-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8cc7ff"/></marker>
  <marker id="arrow-support" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8397ad"/></marker>
  <marker id="arrow-result" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d6b4fc"/></marker>
  <style>
    text { font-family: 'DejaVu Sans', Arial, sans-serif; }
    .main-edge { fill: none; stroke: #8cc7ff; stroke-width: 2.4; stroke-linejoin: round; marker-end: url(#arrow-main); }
    .support-edge { fill: none; stroke: #8397ad; stroke-width: 1.9; stroke-dasharray: 5 5; marker-end: url(#arrow-support); }
    .result-edge { fill: none; stroke: #d6b4fc; stroke-width: 2.4; stroke-linejoin: round; marker-end: url(#arrow-result); }
  </style>
</defs>
