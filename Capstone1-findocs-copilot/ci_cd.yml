name: FinDocs Copilot CI/CD & RAG Evaluation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run automated ingestion pipeline (Module 07 Chunking)
        run: |
          python -m src.ingest

      - name: Run PyTest Unit Tests (Best practices, re-ranking, query rewrite)
        run: |
          pytest tests/ -v

      - name: Run Automated Retrieval Evaluation (doc_id & chunk_id HitRate@5 / MRR@5)
        run: |
          python -m src.eval_retrieval

      - name: Run Automated LLM Output Evaluation (LLM-as-a-Judge Relevance)
        run: |
          python -m src.eval_rag

      - name: Archive Evaluation Results
        uses: actions/upload-artifact@v4
        with:
          name: findocs-evaluation-results
          path: evaluation_results/
