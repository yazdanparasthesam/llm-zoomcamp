apiVersion: v1
kind: ConfigMap
metadata:
  name: findocs-config
  namespace: default
data:
  USE_DOCKER: "true"
  ELASTICSEARCH_URL: "http://findocs-elasticsearch:9200"
  POSTGRES_HOST: "findocs-postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "findocs_db"
  POSTGRES_USER: "postgres"
---
apiVersion: v1
kind: Secret
metadata:
  name: findocs-secret
  namespace: default
type: Opaque
stringData:
  POSTGRES_PASSWORD: "postgres"
  GROQ_API_KEY: "" # Fill in with your Groq API key or leave empty for intelligent fallback mode
  GF_SECURITY_ADMIN_PASSWORD: "admin"
