apiVersion: apps/v1
kind: Deployment
metadata:
  name: findocs-postgres
  namespace: default
  labels:
    app: findocs-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: findocs-postgres
  template:
    metadata:
      labels:
        app: findocs-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: findocs-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: findocs-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: findocs-secret
                  key: POSTGRES_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: findocs-postgres
  namespace: default
spec:
  selector:
    app: findocs-postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP
