apiVersion: apps/v1
kind: Deployment
metadata:
  name: complaintradar-app
  namespace: default
  labels:
    app: complaintradar-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: complaintradar-app
  template:
    metadata:
      labels:
        app: complaintradar-app
    spec:
      containers:
        - name: complaintradar-app
          image: complaintradar-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          envFrom:
            - configMapRef:
                name: complaintradar-config
            - secretRef:
                name: complaintradar-secret
---
apiVersion: v1
kind: Service
metadata:
  name: complaintradar-app
  namespace: default
spec:
  selector:
    app: complaintradar-app
  ports:
    - protocol: TCP
      port: 8501
      targetPort: 8501
  type: LoadBalancer
